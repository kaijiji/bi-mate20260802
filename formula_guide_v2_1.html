</style><script src="https://cdn.tailwindcss.com"></script><script>window.MathJax={tex:{inlineMath:[["\\(","\\)" ]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script></head><body><header><a class="back" href="photothermal_bimaterial_predictor_v2_1.html#model">← アプリの数式一覧へ戻る</a><h1 id="title">数式解説</h1></header><main><div class="card"><div class="formula" id="formula"></div></div><div class="card"><h2>この式は何を求めるのか</h2><p id="goal"></p></div><div class="card"><h2>導出を一歩ずつ</h2><ol id="steps"></ol></div><div class="card"><h2>単位の確認</h2><p id="units"></p></div><div class="card"><h2>簡単な数値例</h2><p id="example"></p></div><div class="card"><h2>アプリではどこに使うか</h2><p id="appuse"></p></div><div class="card"><h2>仮定・注意点</h2><p id="limits"></p></div><div class="nav"><button onclick="history.back()">前のページへ</button><button onclick="location.href='photothermal_bimaterial_predictor_v2_1.html#model'">数式一覧へ</button></div></main><script>const D={"geometry":{"title":"ゴム層厚さ","formula":"t_r=t_{\\mathrm{all}}-t_a-t_s","goal":"三層構造のうち、実測全厚からゴム層だけの厚さを求めます。","steps":["全厚はゴム、接着剤、SUSの和です。","tₐₗₗ=tᵣ+tₐ+tₛ と書きます。","両辺からtₐとtₛを引くと目的式になります。"],"units":"すべてmmまたはmで統一します。","example":"0.483−0.100−0.040=0.343 mm","appuse":"SUS厚さを変えるたびに自動再計算します。","limits":"各層の厚さ測定誤差がそのままゴム厚さへ入ります。"},"heat-capacity":{"title":"三層の単位面積熱容量","formula":"C_A=\\sum_{i\\in\\{r,a,s\\}}\\rho_i c_i t_i","goal":"面積1 m²の試験片を1 K温めるのに必要な熱量を求めます。","steps":["層iの体積は面積1 m²×厚さtᵢです。","質量はρᵢtᵢです。","熱容量は質量×比熱なのでρᵢcᵢtᵢです。","三層分を足します。"],"units":"kg/m³ × J/(kg·K) × m = J/(m²·K)","example":"ゴム、接着剤、SUSの各項を計算し加算します。","appuse":"温度応答と宇宙の数値積分に使います。","limits":"各層が同じ温度という集中熱容量仮定です。"},"absorbed-flux":{"title":"吸収光熱流束","formula":"q_{\\mathrm{abs}}=\\alpha G","goal":"入射光のうち熱へ変換される割合を求めます。","steps":["Gは単位面積あたりの入射光パワーです。","αは0から1の光熱変換割合です。","両者の積が吸収熱流束です。"],"units":"無次元 × W/m² = W/m²","example":"α=0.95、G=827なら785.65 W/m²です。","appuse":"熱収支の加熱項です。","limits":"波長、材料、表面状態でαは変化します。"},"air-water-balance":{"title":"空気中・水中の熱収支","formula":"C_A\\frac{\\mathrm dT}{\\mathrm dt}=\\alpha G-H_{\\mathrm{eff}}(T-T_\\infty)","goal":"入ってくる熱と逃げる熱から温度変化速度を求めます。","steps":["左辺は単位時間あたりの蓄熱です。","右辺第1項は吸収光です。","右辺第2項は周囲との温度差に比例する熱損失です。","入力−損失=蓄熱です。"],"units":"各項はW/m²です。","example":"初めはT=T∞なので損失0、温度上昇後は損失が増えます。","appuse":"空気中と水中の基本微分方程式です。","limits":"H_effを一定とする近似です。"},"effective-h":{"title":"有効熱伝達率","formula":"H_{\\mathrm{eff}}=H A_f","goal":"片面基準の熱伝達率を放熱面積へ換算します。","steps":["Hを片面基準値とします。","両面が同程度に放熱するならA_f=2です。","片面だけならA_f=1です。"],"units":"W/(m²·K)","example":"空気中H=15、両面ならH_eff=30です。","appuse":"温度の定常値と時定数に使います。","limits":"各面の条件が違う場合は本来H₁+H₂で扱います。"},"temperature-response":{"title":"温度の時間応答","formula":"T(t)=T_\\infty+\\frac{\\alpha G}{H_{\\mathrm{eff}}}\\left(1-e^{-t/\\tau}\\right)","goal":"一定光を当てたときの温度履歴を解析式で求めます。","steps":["熱収支をΔT=T−T∞で書き直します。","C_A dΔT/dt + H_effΔT = αG です。","一次線形微分方程式の一般解は定常解＋指数減衰です。","初期条件ΔT(0)=0を入れると目的式になります。"],"units":"αG/H_effはK、指数の中は無次元です。","example":"t=0でT=T∞、十分長時間でT=T∞+αG/H_effです。","appuse":"空気中・水中の全時刻計算に使います。","limits":"H_eff一定、光強度一定が前提です。"},"time-constant":{"title":"熱時定数","formula":"\\tau=\\tau_{\\mathrm{ref}}\\frac{C_A}{C_{A,\\mathrm{ref}}}\\frac{H_{\\mathrm{eff,ref}}}{H_{\\mathrm{eff}}}","goal":"厚さ・材料・環境が変わったときの立ち上がり速度を推定します。","steps":["理想集中系ではτ=C_A/H_effです。","基準実験にも同じ比例関係があると考えます。","基準値との比を取ると式になります。"],"units":"s","example":"熱容量2倍ならτ2倍、熱伝達率2倍ならτ半分です。","appuse":"高田実験の23 sを基準に補正します。","limits":"接触熱抵抗や機械遅れは含みません。"},"space-radiation":{"title":"宇宙・真空の放射熱収支","formula":"C_A\\frac{\\mathrm dT}{\\mathrm dt}=\\alpha G-A_f\\varepsilon\\sigma\\left(T^4-T_\\infty^4\\right)","goal":"対流がない環境で放射冷却を考慮します。","steps":["吸収光はαGです。","黒体放射はσT⁴です。","実表面は放射率εを掛けます。","周囲から受ける放射を引き、正味放射損失にします。"],"units":"TはK、σはW/(m²·K⁴)です。","example":"温度が上がるほどT⁴で放射損失が急増します。","appuse":"時間刻みで数値積分します。","limits":"宇宙の等価放射温度をT∞へ入力する必要があります。"},"radiative-h":{"title":"放射等価熱伝達率","formula":"h_{\\mathrm{rad}}=A_f\\varepsilon\\sigma\\frac{T^4-T_\\infty^4}{T-T_\\infty}","goal":"放射熱を対流と似た形で見やすく表示します。","steps":["正味放射熱流束を温度差で割ります。","q_rad=h_rad(T−T∞)となるよう定義します。","T⁴−T∞⁴は因数分解できます。"],"units":"W/(m²·K)","example":"温度が高いほどh_radも大きくなります。","appuse":"状態表示とCSVへ出力します。","limits":"T=T∞では極限値を使う必要があり、アプリでは0表示です。"},"thermal-strain":{"title":"各層の自由熱ひずみ","formula":"\\varepsilon_i^{\\mathrm T}=\\alpha_i\\Delta T","goal":"拘束されない各材料が温度でどれだけ伸縮するか求めます。","steps":["線膨張係数は温度1 Kあたりのひずみです。","温度差ΔTを掛けます。","ゴムαᵣは負なので加熱で収縮します。"],"units":"1/K × K = 無次元","example":"αᵣ=−1.356×10⁻³、ΔT=25 Kなら約−3.39%です。","appuse":"三層梁の熱軸力と熱モーメントへ入ります。","limits":"αが温度で一定という近似です。"},"abd":{"title":"三層梁の剛性係数","formula":"\\begin{aligned}A&=\\sum_i E_i b\\left(z_i-z_{i-1}\\right)\\\\B&=\\frac12\\sum_i E_i b\\left(z_i^2-z_{i-1}^2\\right)\\\\D&=\\frac13\\sum_i E_i b\\left(z_i^3-z_{i-1}^3\\right)\\end{aligned}","goal":"積層梁の伸び、伸びと曲げの連成、曲げの硬さを表します。","steps":["層内ひずみをε(z)=ε₀+κzとします。","応力はσ=E(ε−αΔT)です。","応力を厚さ方向に積分すると軸力が得られます。","応力×zを積分するとモーメントが得られます。","積分係数がA、B、Dです。"],"units":"A:N、B:N·m、D:N·m²","example":"SUSはEが非常に大きいため薄くてもDへ強く効きます。","appuse":"三層梁つり合い式の左辺です。","limits":"完全接着、線形弾性、平面保持を仮定します。"},"thermal-resultants":{"title":"熱軸力・熱モーメント","formula":"\\begin{aligned}N_{\\mathrm T}&=\\sum_i E_i b\\alpha_i\\Delta T\\left(z_i-z_{i-1}\\right)\\\\M_{\\mathrm T}&=\\frac12\\sum_i E_i b\\alpha_i\\Delta T\\left(z_i^2-z_{i-1}^2\\right)\\end{aligned}","goal":"各層が自由熱ひずみを妨げられた結果として生じる合力をまとめます。","steps":["熱応力部分EαΔTを考えます。","厚さ方向に積分するとN_Tです。","さらにzを掛けて積分するとM_Tです。"],"units":"N_T:N、M_T:N·m","example":"ゴム収縮とSUS膨張が反対方向なのでM_Tが大きくなります。","appuse":"三層梁つり合い式の右辺です。","limits":"接着剤αaが未同定なので現在は0です。"},"laminate-equilibrium":{"title":"三層多層梁のつり合い式","formula":"\\begin{bmatrix}A&B\\\\B&D\\end{bmatrix}\\begin{Bmatrix}\\varepsilon_0\\\\\\kappa\\end{Bmatrix}=\\begin{Bmatrix}N_{\\mathrm T}\\\\M_{\\mathrm T}\\end{Bmatrix}","goal":"外力のない積層梁の平均軸ひずみと曲率を同時に決定します。","steps":["合成軸力はN=Aε₀+Bκ−N_Tです。","合成モーメントはM=Bε₀+Dκ−M_Tです。","自由変形なのでN=0、M=0です。","移項すると行列式になります。","2元連立方程式を解いてε₀とκを得ます。"],"units":"ε₀は無次元、κは1/mです。","example":"アプリは行列式の逆行列を明示計算しています。","appuse":"変形計算の中心式です。","limits":"層間すべり、剥離、塑性変形は含みません。"},"nonlinear-strain":{"title":"温度依存ひずみ補正","formula":"\\Delta T_{\\mathrm{eff}}=\\Delta T\\left(1+\\gamma\\Delta T\\right)","goal":"収縮係数が温度により変化する場合の簡易補正です。","steps":["γ=0なら線形モデルです。","γ>0なら高温ほど実効温度差が大きくなります。","各層熱ひずみ計算へΔT_effを使います。"],"units":"γは1/Kです。","example":"γ=0.001、ΔT=50 Kなら倍率1.05です。","appuse":"材料入力で変更できます。","limits":"実測データがない場合はγ=0を推奨します。"},"prestrain":{"title":"予伸長倍率補正","formula":"\\kappa=\\kappa_{\\mathrm{laminate}}\\frac{\\lambda_{\\mathrm{pre}}-1}{1.75-1}","goal":"予伸長が変わるとGough-Joule収縮が変わる影響を暫定的に表します。","steps":["高田実験の伸長倍率1.75を基準にします。","伸長ひずみはλ−1です。","曲率を伸長ひずみ比で比例補正します。"],"units":"無次元比です。","example":"λ=1.75なら倍率1、λ=1.5なら約0.667です。","appuse":"予伸長入力から曲率へ反映します。","limits":"川端さんの研究ではα自体が初期ひずみに依存するとされ、本式は暫定近似です。"},"arc-length":{"title":"変形後の円弧長","formula":"L\\prime=L\\left(1+\\varepsilon_0\\right)","goal":"曲げだけでなく梁全体の平均伸縮を考慮します。","steps":["ε₀は中央基準位置の平均軸ひずみです。","ひずみの定義ΔL/L=ε₀を使います。","ΔL=Lε₀なのでL′=L+ΔLです。"],"units":"m","example":"ε₀=0.001なら長さは0.1%増えます。","appuse":"回転角θの計算に使います。","limits":"大ひずみでは真ひずみとの区別が必要です。"},"rotation":{"title":"先端回転角","formula":"\\theta=\\kappa L\\prime","goal":"一定曲率の円弧が何度回転するか求めます。","steps":["曲率κは単位長さあたりの角度変化です。","微小長さdsでdθ=κdsです。","一定曲率なら0からL′まで積分してθ=κL′です。"],"units":"rad","example":"κ=5 1/m、L=0.045 mなら約0.225 rad=12.9°です。","appuse":"形状、回転角表示、警告に使います。","limits":"曲率が長さ方向に一定という仮定です。"},"arc-coordinate":{"title":"大変形の先端座標","formula":"x=\\frac{\\sin\\theta}{\\kappa},\\qquad \\delta=\\frac{1-\\cos\\theta}{\\kappa}","goal":"小変形近似を使わず、円弧の幾何から先端位置を求めます。","steps":["曲率半径はR=1/κです。","円弧中心から見た座標を三角関数で表します。","x=Rsinθ、y=R(1−cosθ)です。","R=1/κを代入します。"],"units":"m","example":"θが小さいとδ≈κL²/2へ戻ります。","appuse":"自由変形量と形状図に使います。","limits":"θが大きいと鉛直変位は単調増加しません。"},"effective-ei":{"title":"有効曲げ剛性","formula":"(EI)_{\\mathrm{eq}}=D-\\frac{B^2}{A}","goal":"伸びと曲げの連成を除いた純粋な曲げ抵抗を求めます。","steps":["軸力ゼロ条件からε₀をκで表します。","モーメント式へ代入します。","κの係数としてD−B²/Aが残ります。"],"units":"N·m²","example":"B=0の対称断面なら(EI)_eq=Dです。","appuse":"ブロッキング力に使います。","limits":"線形積層梁の等価値です。"},"blocking-force":{"title":"理論ブロッキング力","formula":"F_{\\mathrm{block}}=\\frac{3(EI)_{\\mathrm{eq}}\\lvert\\kappa\\rvert}{2L}","goal":"自由に曲がろうとする試験片の先端を拘束する等価力を推定します。","steps":["自由熱曲率による小変形先端変位はδ_free≈κL²/2です。","片持ちはり先端荷重による変位はδ_F=FL³/[3(EI)]です。","拘束にはδ_F=δ_freeとなる反力が必要です。","両式を等置してFを解きます。"],"units":"N","example":"曲率が2倍なら力も2倍です。","appuse":"理論力表示へ使います。","limits":"大変形、ゴム粘弾性、接触条件を無視した未校正一次近似です。"},"target-time":{"title":"目標変形到達時間","formula":"t_{\\mathrm{hit}}=\\min\\left\\{t\\mid\\delta(t)\\geq\\delta_{\\mathrm{target}}\\right\\}","goal":"指定した変形量へ最初に達する時間を求めます。","steps":["時刻ごとに温度を計算します。","温度から曲率と変形量を計算します。","δが目標値以上になった最初の時刻を選びます。"],"units":"s","example":"目標4 mmなら履歴上で初めて4 mm以上となる時刻です。","appuse":"画面上部の目標到達時間です。","limits":"大変形でδが非単調になる場合は最初の到達です。"},"completion-time":{"title":"応答完了時間","formula":"t_p=-\\tau\\ln(1-p)","goal":"一次遅れ応答が定常値のp倍に達する時間です。","steps":["応答比p=1−exp(−t/τ)です。","exp(−t/τ)=1−pへ移項します。","自然対数を取りtを解きます。"],"units":"s","example":"p=0.95ならt≈2.996τです。","appuse":"空気中・水中の完了時間表示です。","limits":"宇宙放射モデルは単一指数でないため直接適用しません。"},"calibration":{"title":"高田実験による実効係数同定","formula":"\\delta_{\\mathrm{exp}}=\\delta_{\\mathrm{model}}\\!\\left(\\alpha_r\\right)","goal":"未知のゴム実効線膨張係数を実験変形量から逆算します。","steps":["基準温度履歴から100秒時のΔTを決めます。","仮のαᵣで三層梁のκを計算します。","円弧式でδ_modelを計算します。","δ_model−4.9 mmが0になるαᵣを探索します。"],"units":"αᵣは1/Kです。","example":"現在の仮定ではαᵣ=−1.35617×10⁻³ K⁻¹です。","appuse":"高田実験校正プリセットに使います。","limits":"接着剤αa=0、Er=1.5 MPa等の仮定に依存する実効値です。"}};const id=new URLSearchParams(location.search).get('eq')||'geometry',d=D[id]||D.geometry;document.title=d.title+' | 数式解説';for(const k of ['title','goal','units','example','appuse','limits'])document.getElementById(k).textContent=d[k];document.getElementById('formula').innerHTML='\\['+d.formula+'\\]';if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([document.getElementById('formula')]);document.getElementById('steps').innerHTML=d.steps.map(x=>'<li>'+x+'</li>').join('');</script></body></html>
